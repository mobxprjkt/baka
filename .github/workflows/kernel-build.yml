name: Google Common GKI 5.15 (Sapphire)

on:
  workflow_dispatch:
    inputs:
      android_target:
        description: "Android userspace version label (does not change GKI branch)"
        required: true
        type: choice
        options: ["13", "14", "15", "16", "17"]
        default: "14"
      publish_release:
        description: "Publish successful artifacts as a GitHub Release"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag"
        required: false
        type: string
        default: "sapphiren-gki515-test"

permissions:
  contents: write

concurrency:
  group: sapphiren-gki515-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  MANIFEST_BRANCH: common-android13-5.15-lts
  SUKISU_REPO: https://git.zako.shirkneko.top:20004/shirkneko/SukiSU.git
  SUKISU_COMMIT: a81ed4e3d9801e740d132ec0614fdc62735e2b69
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_COMMIT: c1d1da42b74771944207ec45aaceff9c57e84985
  ARCH: arm64
  SUBARCH: arm64
  LLVM: "1"
  LLVM_IAS: "1"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 8G
  ANDROID_TARGET: ${{ inputs.android_target || '14' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout build project
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            jq libelf-dev libssl-dev lz4 make pahole patch python3 rsync unzip \
            zip xz-utils zlib1g-dev device-tree-compiler
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod 0755 /usr/local/bin/repo
          repo --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-sapphiren-gki515-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sapphiren-gki515-

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=time_macros
          ccache --zero-stats

      - name: Sync Google Common GKI 5.15 LTS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel-src
          cd kernel-src
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          repo sync -c -j4 --no-tags --optimized-fetch --fail-fast
          repo manifest -r -o "$GITHUB_WORKSPACE/manifest.lock.xml"
          test -d common
          test -d build
          test -f common/build.config.gki.aarch64
          test -f build/build.sh
          git -C common rev-parse HEAD

      - name: Integrate SukiSU Nova
        working-directory: kernel-src
        run: bash ../builder/scripts/integrate-sukisu-nova.sh

      - name: Integrate SUSFS (kernel + KSU backend)
        working-directory: kernel-src
        run: bash ../builder/scripts/integrate-susfs.sh

      - name: Configure GKI Kconfig
        working-directory: kernel-src
        run: bash ../builder/scripts/configure-kernel.sh

      - name: Fetch SukiSU Nova manager APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/manager
          bash builder/scripts/fetch-manager-apks.sh \
            "SukiSU-Nova/SukiSU-Nova" "$GITHUB_WORKSPACE/dist/manager"

      - name: Locate Google Clang
        working-directory: kernel-src
        shell: bash
        run: |
          set -euo pipefail
          CLANG_BIN="$(find -L prebuilts/clang/host/linux-x86 -type f \
            -path '*/bin/clang' -printf '%h\n' | sort -V | tail -n 1)"
          test -n "$CLANG_BIN" || {
            echo "::error::Google Clang missing from synced manifest"
            exit 1
          }
          FULL_CLANG_BIN="$GITHUB_WORKSPACE/kernel-src/$CLANG_BIN"
          echo "$FULL_CLANG_BIN" >> "$GITHUB_PATH"
          echo "CLANG_BIN=$FULL_CLANG_BIN" >> "$GITHUB_ENV"
          "$FULL_CLANG_BIN/clang" --version

      - name: Build Google GKI Image
        working-directory: kernel-src
        env:
          BUILD_CONFIG: common/build.config.gki.aarch64
          DIST_DIR: ${{ github.workspace }}/dist/kernel
          CC: ccache clang
          HOSTCC: ccache clang
          CCACHE_BASEDIR: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIST_DIR"
          export PATH="$CLANG_BIN:$PATH"
          BUILD_CONFIG="$BUILD_CONFIG" DIST_DIR="$DIST_DIR" \
            CC="$CC" HOSTCC="$HOSTCC" LLVM=1 LLVM_IAS=1 \
            ARCH=arm64 SUBARCH=arm64 CCACHE_BASEDIR="$CCACHE_BASEDIR" \
            build/build.sh
          test -s "$DIST_DIR/Image" || {
            echo "::error::GKI build did not produce dist/kernel/Image"
            find "$DIST_DIR" -maxdepth 2 -type f -print || true
            exit 1
          }
          ls -lh "$DIST_DIR/Image"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git \
            "$RUNNER_TEMP/AnyKernel3"
          cp -a builder/anykernel/. "$RUNNER_TEMP/AnyKernel3/"
          cp dist/kernel/Image "$RUNNER_TEMP/AnyKernel3/Image"
          mkdir -p dist/release
          KERNEL_SHA="$(git -C kernel-src/common rev-parse --short HEAD)"
          ZIP="AnyKernel3-Sapphiren-Google-GKI-5.15-${KERNEL_SHA}.zip"
          (cd "$RUNNER_TEMP/AnyKernel3" && zip -r9 \
            "$GITHUB_WORKSPACE/dist/release/$ZIP" . \
            -x '.git/*' -x '.github/*')
          sha256sum "dist/release/$ZIP" > "dist/release/$ZIP.sha256"

      - name: Write build metadata
        if: always()
        shell: bash
        run: |
          mkdir -p dist/release
          {
            echo "Device target: sapphiren / sapphire (experimental)"
            echo "Kernel base: Google Common GKI 5.15 LTS"
            echo "Manifest branch: $MANIFEST_BRANCH"
            echo "SukiSU Nova commit: $SUKISU_COMMIT"
            echo "SUSFS commit: $SUSFS_COMMIT"
            echo "Android userspace label: $ANDROID_TARGET"
            echo "Compiler: Google Clang from Android kernel manifest"
            echo "Output: Image + AnyKernel3 ZIP"
            echo "Warning: generic GKI build; device boot/vendor compatibility is not validated."
            echo "Kernel common commit: $(git -C kernel-src/common rev-parse HEAD 2>/dev/null || echo unavailable)"
          } > dist/release/BUILD_INFO.txt
          test ! -f kernel-src/integration-versions.txt || \
            cat kernel-src/integration-versions.txt >> dist/release/BUILD_INFO.txt

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sapphiren-Google-Common-GKI-5.15
          path: |
            dist/release/*
            dist/manager/*.apk
            manifest.lock.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Sapphiren Google Common GKI 5.15
          body_path: dist/release/BUILD_INFO.txt
          files: |
            dist/release/*.zip
            dist/release/*.sha256
            dist/manager/*.apk
            manifest.lock.xml
          make_latest: false
